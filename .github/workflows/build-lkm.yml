name: Build All GKI
on:
  push:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build-lkm.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        include:
          - kmi: android12-5.10
            image: ghcr.io/ylarod/ddk-min:android12-5.10-20260313
          - kmi: android13-5.10
            image: ghcr.io/ylarod/ddk-min:android13-5.10-20260313
          - kmi: android13-5.15
            image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
          - kmi: android14-5.15
            image: ghcr.io/ylarod/ddk-min:android14-5.15-20260313
          - kmi: android14-6.1
            image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
          - kmi: android15-6.6
            image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
          - kmi: android16-6.12
            image: ghcr.io/ylarod/ddk-min:android16-6.12-20260313
          - kmi: android17-6.18
            image: ghcr.io/ylarod/ddk-min:android17-6.18
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make VER=${{ matrix.kmi }}
      - uses: actions/upload-artifact@v4
        with:
          name: kallrecon-${{ matrix.kmi }}
          path: out/${{ matrix.kmi }}/kallrecon.ko

  # the GKI images above are all arm64, build the x86_64 anchor object too:
  # two kernels x {main, test} x {native, explicit ARCH}, covering both anchor
  # selection branches on the lowest supported kernel and on the current LTS
  build-x86_64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kver: "5.10"
            tarball: https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.231.tar.xz
            srcdir: linux-5.10.231
          - kver: "6.6"
            tarball: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
            srcdir: linux-6.6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare vanilla x86_64 kernel tree (${{ matrix.kver }})
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison libelf-dev libssl-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linux.tar.xz" "${{ matrix.tarball }}"
          tar -xf "$RUNNER_TEMP/linux.tar.xz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/${{ matrix.srcdir }}" defconfig
          make -C "$RUNNER_TEMP/${{ matrix.srcdir }}" olddefconfig
          make -C "$RUNNER_TEMP/${{ matrix.srcdir }}" modules_prepare
      - name: Build (native, ARCH unset)
        run: |
          make KDIR="$RUNNER_TEMP/${{ matrix.srcdir }}" VER=${{ matrix.kver }}-native KBUILD_MODPOST_WARN=1
          make KDIR="$RUNNER_TEMP/${{ matrix.srcdir }}" TARGET=test VER=${{ matrix.kver }}-test-native KBUILD_MODPOST_WARN=1
      - name: Build (explicit ARCH=x86_64)
        run: |
          make KDIR="$RUNNER_TEMP/${{ matrix.srcdir }}" ARCH=x86_64 VER=${{ matrix.kver }}-arch KBUILD_MODPOST_WARN=1
          make KDIR="$RUNNER_TEMP/${{ matrix.srcdir }}" TARGET=test ARCH=x86_64 VER=${{ matrix.kver }}-test-arch KBUILD_MODPOST_WARN=1
      - uses: actions/upload-artifact@v4
        with:
          name: kallrecon-x86_64-${{ matrix.kver }}
          path: |
            out/${{ matrix.kver }}-*/kallrecon.ko
            out/${{ matrix.kver }}-test-*/test_probe.ko
