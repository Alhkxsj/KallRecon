name: Build All GKI
on:
  push:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build-lkm.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        include:
          - kmi: android12-5.10
            image: ghcr.io/ylarod/ddk-min:android12-5.10-20260313
          - kmi: android13-5.10
            image: ghcr.io/ylarod/ddk-min:android13-5.10-20260313
          - kmi: android13-5.15
            image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
          - kmi: android14-5.15
            image: ghcr.io/ylarod/ddk-min:android14-5.15-20260313
          - kmi: android14-6.1
            image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
          - kmi: android15-6.6
            image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
          - kmi: android16-6.12
            image: ghcr.io/ylarod/ddk-min:android16-6.12-20260313
          - kmi: android17-6.18
            image: ghcr.io/ylarod/ddk-min:android17-6.18
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make VER=${{ matrix.kmi }}
      - uses: actions/upload-artifact@v4
        with:
          name: kallrecon-${{ matrix.kmi }}
          path: out/${{ matrix.kmi }}/kallrecon.ko

  # the GKI images above are all arm64, build the x86_64 anchor object too
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare vanilla x86_64 kernel tree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison libelf-dev libssl-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linux.tar.xz" \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
          tar -xf "$RUNNER_TEMP/linux.tar.xz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/linux-6.6" defconfig
          make -C "$RUNNER_TEMP/linux-6.6" olddefconfig
          make -C "$RUNNER_TEMP/linux-6.6" modules_prepare
      - name: Build (native, ARCH unset)
        run: make KDIR="$RUNNER_TEMP/linux-6.6" VER=x86_64-native KBUILD_MODPOST_WARN=1
      - name: Build (explicit ARCH=x86_64)
        run: make KDIR="$RUNNER_TEMP/linux-6.6" ARCH=x86_64 VER=x86_64-arch KBUILD_MODPOST_WARN=1
      - uses: actions/upload-artifact@v4
        with:
          name: kallrecon-x86_64
          path: out/x86_64-*/kallrecon.ko
